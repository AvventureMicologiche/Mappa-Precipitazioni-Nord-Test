[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions]
  directory = "netlify/functions"

[build]
  publish = "."
  # Salta la build se il commit non ha toccato niente di pubblicato.
  # Copia della regola di produzione, tenuta allineata (5/8/2026).
  #
  # Si elenca cosa si IGNORA, mai cosa conta: prima la regola elencava i file
  # che DEVONO far ripubblicare (index.html e netlify/), e il 22 luglio 2026
  # una preview.jpg nuova e' rimasta su GitHub senza mai arrivare sul sito.
  # Una dimenticanza nella lista di cosa si ignora costa un deploy inutile,
  # una dimenticanza nella lista di cosa conta costa una modifica invisibile.
  #
  #  - data/       i collector scrivono decine di commit al giorno;
  #  - .github/    workflow e script girano su GitHub Actions, non sono il sito;
  #  - *.md        documentazione (CLAUDE.md, MIGRAZIONE-v5.md, README).
  #
  # Sul consumo Netlify i deploy sono il 98% dei crediti (~15 l'uno), e su nove
  # deploy consecutivi di produzione SETTE erano documentazione o script.
  #
  # ⚠️ NON usare `HEAD^ HEAD`: guarda solo l'ULTIMO commit. Il 9/8/2026 in
  # PRODUZIONE un push di tre commit (due su index.html + CLAUDE.md in cima) e'
  # stato annullato perche' la regola ha esaminato solo il commit del CLAUDE.md
  # — la correzione e' rimasta su GitHub senza mai arrivare sul sito. Coi
  # collector non si era mai visto: pushano un commit alla volta.
  # CACHED_COMMIT_REF..COMMIT_REF e' l'intervallo INTERO dall'ultimo deploy
  # pubblicato a questo, ed e' quello che Netlify stessa usa nella sua regola di
  # default. Il ripiego HEAD^/HEAD serve solo se le variabili mancassero
  # (build manuale da CLI).
  ignore = "git diff --quiet ${CACHED_COMMIT_REF:-HEAD^} ${COMMIT_REF:-HEAD} -- . ':(exclude)data' ':(exclude).github' ':(exclude)*.md'"
