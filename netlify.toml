[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions]
  directory = "netlify/functions"

[build]
  publish = "."
  # Salta la build se il commit non ha toccato niente di pubblicato.
  #
  # Si elenca cosa si IGNORA, mai cosa conta: prima la regola elencava i file
  # che DEVONO far ripubblicare (index.html e netlify/), e il 22 luglio 2026
  # una preview.jpg nuova e' rimasta su GitHub senza mai arrivare sul sito.
  # Una dimenticanza nella lista di cosa si ignora costa un deploy inutile,
  # una dimenticanza nella lista di cosa conta costa una modifica invisibile.
  #
  # Cosa si ignora e perche':
  #  - data/       i collector scrivono decine di commit al giorno, e il sito
  #                legge quei file dal raw di GitHub, non da qui;
  #  - .github/    workflow e script dei collector girano su GitHub Actions,
  #                non fanno parte del sito pubblicato;
  #  - *.md        documentazione (CLAUDE.md, README, checklist di migrazione).
  #
  # Misurato il 5/8/2026 sul consumo Netlify: i deploy erano il 98% dei crediti
  # (1.005 su 1.024, ~15 crediti l'uno) e su nove deploy consecutivi SETTE
  # erano di documentazione o di script dei collector — roba che non cambia di
  # una virgola il sito pubblicato. Le due esclusioni qui sotto li azzerano.
  #
  # ⚠️ NON usare `HEAD^ HEAD`: guarda solo l'ULTIMO commit. Il 9/8/2026 un push
  # di tre commit (due su index.html + CLAUDE.md in cima) e' stato annullato
  # perche' la regola ha esaminato solo il commit del CLAUDE.md — la corsa dei
  # 50ms e' rimasta su GitHub senza mai arrivare sul sito. Coi collector non si
  # era mai visto: pushano un commit alla volta. CACHED_COMMIT_REF..COMMIT_REF
  # e' l'intervallo INTERO dall'ultimo deploy pubblicato a questo, ed e' quello
  # che Netlify stessa usa nella sua regola di default. Il ripiego HEAD^/HEAD
  # serve solo se le variabili mancassero (build manuale da CLI).
  ignore = "git diff --quiet ${CACHED_COMMIT_REF:-HEAD^} ${COMMIT_REF:-HEAD} -- . ':(exclude)data' ':(exclude).github' ':(exclude)*.md'"

# 17/8/2026: i file dati sono pubblici e servono anche come RISERVA dell'archivio
# GitHub per l'altro sito (il test legge i dati di prod, e i piloti viceversa):
# senza questo header il browser blocca la lettura da un altro dominio.
[[headers]]
  for = "/data/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
