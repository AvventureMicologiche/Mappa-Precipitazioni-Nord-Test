name: MeteoHub (pilota)
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per ieri+altroieri)'
        required: false
        default: ''
      solo_rete:
        description: 'Una rete sola (es. arpafvg). Vuoto = tutte'
        required: false
        default: ''
  # MIGRATO IN PRODUZIONE il 1/8/2026: la raccolta MeteoHub gira sul repo di
  # produzione, tenerla accesa anche qui farebbe scrivere gli stessi dati a due
  # repo. Cron commentati come per ticino.yml: per riattivare basta togliere i
  # cancelletti, e nel frattempo resta lanciabile a mano (workflow_dispatch).
  # Ogni run raccoglie ieri + altroieri + auto-riparazione fino a 7gg.
  # Orari sfalsati rispetto a ticino.yml (xx:30) per ridurre i conflitti
  # di push tra workflow concorrenti.
  # schedule:
  #   - cron: '20 2 * * *'
  #   - cron: '20 4 * * *'
  #   - cron: '20 7 * * *'
  #   - cron: '50 11 * * *'
  #   - cron: '50 17 * * *'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Raccoglie dati MeteoHub
        id: collect
        run: node .github/scripts/collect-meteohub.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
          SOLO_RETE: ${{ inputs.solo_rete }}
        continue-on-error: true
      - name: Retry 1
        if: steps.collect.outcome == 'failure'
        run: sleep 30 && node .github/scripts/collect-meteohub.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
          SOLO_RETE: ${{ inputs.solo_rete }}
        continue-on-error: true
      - name: Retry 2
        if: steps.collect.outcome == 'failure'
        run: sleep 60 && node .github/scripts/collect-meteohub.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
          SOLO_RETE: ${{ inputs.solo_rete }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/meteohub-*/
          git diff --staged --quiet || git commit -m "meteohub $(date -u +%Y-%m-%d)"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "Push fallito dopo 5 tentativi"; exit 1; }
